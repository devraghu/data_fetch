name: Discover ArthikaMF AM Requests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Discover AM browser requests
        run: python scripts/discover_am_requests.py

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthikamf-am-discovery
          path: publish/arthikamf/am/discovery

      - name: Publish discovery to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init
          git checkout -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery
          git commit -m "ArthikaMF AM discovery $(date -u +%F-%H%M)" || echo "No changes"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin data
